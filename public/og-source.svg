    <rect x="838" y="89" width="122" height="35" rx="17.5" fill="#9a7430" opacity="0.54" transform="rotate(-25 899 106.5)"/>
    <rect x="777" y="448" width="92" height="26" rx="13" fill="#bd653e" opacity="0.44" transform="rotate(18 823 461)"/>

    <path d="M1046 120L1058 149L1089 139L1075 168L1103 184L1071 189L1075 222L1051 199L1028 222L1031 189L999 184L1027 168L1013 139L1044 149Z" fill="#bd653e" opacity="0.52"/>
    <circle cx="964" cy="359" r="25" fill="none" stroke="#9a7430" stroke-width="9" opacity="0.47"/>
    <path d="M1081 501C1102 477 1133 479 1154 502C1171 522 1167 552 1144 568C1120 584 1083 570 1071 546C1064 531 1068 516 1081 501Z" fill="none" stroke="#94565f" stroke-width="8" opacity="0.50"/>

    <circle cx="739" cy="115" r="6" fill="#c4d2ad" opacity="0.68"/>
    <circle cx="762" cy="115" r="6" fill="#9a7430" opacity="0.68"/>
    <circle cx="785" cy="115" r="6" fill="#94565f" opacity="0.68"/>

    <!-- Wordmark -->
    <text x="72" y="78" fill="#c4d2ad" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" font-weight="700">F:</text>
    <text x="124" y="76" fill="#fffaf0" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.5">fotonet</text>

    <!-- Primary copy -->
    <text x="74" y="156" fill="#c4d2ad" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="2.4">OPEN-SOURCE OBJECT DETECTION</text>
    <text x="70" y="250" fill="#fffaf0" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-2.2">Compact object detection.</text>
    <text x="70" y="324" fill="#fffaf0" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-2.2">Measured and documented.</text>
    <text x="74" y="382" fill="#fffaf0" opacity="0.78" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="400">NMS-free inference · resumable training · deployment exports</text>

    <!-- Footer rule and metadata -->
    <line x1="74" y1="529" x2="1126" y2="529" stroke="#c4d2ad" stroke-width="1" opacity="0.55"/>
    <text x="74" y="574" fill="#c4d2ad" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="1.7">PYTORCH · PYTHON 3.10+</text>
