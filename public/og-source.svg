<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">fotonet — compact object detection, measured and documented</title>
  <desc id="desc">A deterministic social card in the forest-green visual style of the fotonet honesty panel.</desc>
  <defs>
    <pattern id="paper-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.75" fill="#fffaf0" opacity="0.055"/>
    </pattern>
    <clipPath id="card-bounds">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-bounds)">
    <rect width="1200" height="630" fill="#19472f"/>
    <rect width="1200" height="630" fill="url(#paper-dots)"/>

    <!-- Material Expressive-inspired geometry; all paths are intentionally static. -->
    <path d="M951 19C1024-4 1120 13 1166 69C1211 124 1199 214 1138 251C1077 288 988 264 947 211C906 158 878 42 951 19Z" fill="#3d6f73" opacity="0.42"/>
