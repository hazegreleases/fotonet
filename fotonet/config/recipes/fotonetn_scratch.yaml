# FOTO-NET-N scratch recipe for COCO-style object detection.
# Designed for full training, not smoke tests.

model: fotonetn
pretrained: false
resume: false

train:
  epochs: 510
  imgsz: 640
  imgsz_schedule:
    - [0.35, 512]
    - [0.35, 576]
    - [0.30, 640]
  batch: 16
  val_batch: 8
  nbs: 128
  workers: 4
  pin_memory: true
  cache_to_ram: true
  ram_cache_images: 1024
  cache_labels: true
  disk_cache_images: false
  amp: true
  # The attention reduction itself stays in FP32; the remaining validation
  # graph uses AMP and automatically retries the complete pass in FP32 if a
  # future operator ever emits a non-finite value.
  val_amp: true
  cos_lr: true
  compile_model: false
  val_period: 5
  val_subset_size: 0
  full_val_after: 0.90
  save_period: -1
  slim_best: true
  best_metric: mAP50_95

optimizer:
  # [SIMPLIFIED] MuSGD remains available for controlled ablations, but this
  # public baseline uses a conventional, independently verifiable optimizer.
  name: sgd
  lr0: 0.01
  lrf: 0.001
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3

augment:
  mosaic: 0.909
  mixup: 0.012
  # Bounding-box-only copy-paste can create unlabeled/occluded objects.
  copy_paste: 0.0
  copy_paste_mode: flip
  close_mosaic: 15
  scale: 0.562
  fliplr: 0.606
  flipud: 0.0
  degrees: 1.11
  shear: 1.46
  translate: 0.071
  hsv_h: 0.014
  hsv_s: 0.645
  hsv_v: 0.566
  bgr: 0.106
  mixup_alpha: 32.0

loss:
  box: 7.5
  cls: 1.0
  dfl: 1.5
  dfl_mean_over_coords: true
  dual_branch_curriculum: true
  dual_branch_start_epoch: 1
  dual_branch_warmup_epochs: 120
  o2o_start_weight: 0.35
  o2o_end_weight: 1.0
  o2m_start_weight: 1.0
  o2m_end_weight: 0.25
  o2o_label_smoothing: 0.01
  o2m_label_smoothing: 0.05
  focal_gamma_pos: 2.0
  focal_gamma_neg: 2.0
  quality_targets: true
  quality_power: 1.0
  quality_floor: 0.05
  quality_start_epoch: 25
  quality_warmup_epochs: 50
  qfl_beta: 2.0
  hard_negative_topk: 256
  hard_negative_weight: 0.10
  hard_negative_min_score: 0.15
  hard_negative_start_epoch: 8
  hard_negative_warmup_epochs: 32
  o2o_weight: 1.0
  o2m_weight: 1.0
  # Keep dense dual-assignment through the main representation-learning
  # phase, halve its training-only branch work late, then finish O2O-only.
  o2m_full_epochs: 300
  o2m_sparse_epochs: 450
  o2m_every_n_steps: 2
  o2m_disable_epoch: 450
  consistency_weight: 0.35
  consistency_start_epoch: 10
  consistency_warmup_epochs: 40
  consistency_cls_weight: 0.25
  consistency_box_weight: 0.75
  prog_loss: true
  prog_start_epoch: 1
  prog_warmup_epochs: 60
  cls_start_factor: 1.50
  box_start_factor: 1.30
  dfl_start_factor: 0.85
  quality: 1.0
  quality_loss_start_epoch: 1
  quality_loss_warmup_epochs: 25

matcher:
  topk: 8
  alpha: 1.0
  beta: 2.0
  cost_class: 2.0
  cost_bbox: 2.0
  cost_giou: 1.0
  # Exact SciPy/Hungarian matching is opt-in. Default O2O uses a GPU fast path
  # plus a compact CPU collision resolver, never a per-GT full-matrix GPU loop.
  exact_o2o: false
  exact_o2o_warmup_epochs: null
  exact_o2o_period: 1
  exact_o2o_period_end_epoch: null
  min_small_assign: 4
  small_obj_px: 8.0

smoke_limits:
  max_epochs_2500_images: 15
  max_epochs_5000_images: 8
  recommended_quick_check:
    epochs: 2
    max_images: 256
    imgsz: 128
    val_subset_size: 64
    full_val_after: 1.01  # keep validation subset on final smoke epoch
    mosaic: 0.0
    mixup: 0.0
    copy_paste: 0.0
